<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 36 36" fill="none">
  <style>
    :root {
      --fav-ring: #A9C7FA;
      --fav-core: #2F6BEB;
      --fav-shine: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fav-ring: rgba(79, 134, 247, 0.45);
        --fav-core: #4F86F7;
        --fav-shine: #FFFFFF;
      }
    }
  </style>
  <!-- Middle Ring (r=18) -->
  <circle cx="24" cy="24" r="18" fill="var(--fav-ring)"/>
  <!-- Core (r=12) -->
  <circle cx="24" cy="24" r="12" fill="var(--fav-core)"/>
  <!-- Glossy highlight on core -->
  <ellipse cx="20.5" cy="19" rx="5" ry="3" fill="var(--fav-shine)" opacity="0.6"/>
</svg>
