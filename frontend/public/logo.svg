<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 48" fill="none">
  <style>
    :root {
      --logo-halo: #E3EDFD;
      --logo-ring: #A9C7FA;
      --logo-core: #2F6BEB;
      --logo-shine: #FFFFFF;
      --logo-text: #1B2236;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-halo: rgba(79, 134, 247, 0.16);
        --logo-ring: rgba(79, 134, 247, 0.38);
        --logo-core: #4F86F7;
        --logo-shine: #FFFFFF;
        --logo-text: #F1F5FF;
      }
    }
    .logo-text {
      font-family: 'Outfit Variable', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.01em;
      fill: var(--logo-text);
      dominant-baseline: central;
    }
  </style>
  <!-- Orb Icon at (0, 0) viewBox 48x48 -->
  <g transform="translate(0, 0)">
    <circle cx="24" cy="24" r="24" fill="var(--logo-halo)"/>
    <circle cx="24" cy="24" r="18" fill="var(--logo-ring)"/>
    <circle cx="24" cy="24" r="12" fill="var(--logo-core)"/>
    <ellipse cx="20.5" cy="19" rx="5" ry="3" fill="var(--logo-shine)" opacity="0.6"/>
  </g>
  <!-- Wordmark 'glean' with 10px gap -->
  <text x="58" y="25" class="logo-text">glean</text>
</svg>
